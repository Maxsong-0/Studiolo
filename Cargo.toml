[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/process-safety",
    "crates/vault-broker",
    "crates/vault-admin",
    "crates/vault-index",
    "crates/control-db",
    "crates/audit-ledger",
    "crates/auth",
    "crates/auth-admin",
    "crates/host-config",
    "crates/sync-bridge",
    "crates/sync-transport",
    "crates/backup",
    "crates/observability",
    "crates/policy",
    "crates/runner-adapter",
    "crates/gateway",
    "crates/task-engine",
    "crates/studiolo",
    "crates/workbench",
    "crates/local-server",
    "crates/supply",
    "crates/agent-server",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Maxsong-0/studiolo"
rust-version = "1.97"

# 依赖版本在此统一声明（ADR-001：M0 逐个评估后写死版本；精确解析结果以 Cargo.lock 为准，
# 并同步登记到 vault `01-框架/技术栈.md`）。成员 crate 一律 `xxx.workspace = true`。
[workspace.dependencies]
tree-sitter = "=0.26.13"
tree-sitter-rust = "=0.24.2"
studiolo-core = { path = "crates/core" }
# 秘密驻留面加固：依赖只有 rustix，四个持明文秘密的程序都能无条件依赖（见 crates/process-safety/src/lib.rs）。
studiolo-process-safety = { path = "crates/process-safety" }
studiolo-vault-broker = { path = "crates/vault-broker" }
studiolo-vault-index = { path = "crates/vault-index" }
studiolo-control-db = { path = "crates/control-db" }
studiolo-audit-ledger = { path = "crates/audit-ledger" }
studiolo-auth = { path = "crates/auth" }
studiolo-host-config = { path = "crates/host-config" }
studiolo-sync-bridge = { path = "crates/sync-bridge" }
studiolo-sync-transport = { path = "crates/sync-transport" }
studiolo-backup = { path = "crates/backup" }
studiolo-observability = { path = "crates/observability" }
studiolo-policy = { path = "crates/policy" }
studiolo-runner-adapter = { path = "crates/runner-adapter" }
studiolo-gateway = { path = "crates/gateway" }
studiolo-task-engine = { path = "crates/task-engine" }
studiolo-workbench = { path = "crates/workbench" }
studiolo-supply = { path = "crates/supply" }

# M1 本机只读 HTTP 入口；不装配远程写入、Runner 或同步。
axum = "=0.8.9"
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread", "net", "sync"] }
tower = { version = "0.5", features = ["util"] }

# M2 身份验证与独立会话；复用已锁定的密码库和网络校验实现。
jsonwebtoken = { version = "=10.3.0", features = ["rust_crypto"] }
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls"] }
getrandom = "=0.4.3"
subtle = "=2.6.1"
zeroize = "=1.9.0"
signal-hook = { version = "=0.4.4", default-features = false }
notify = "=8.2.0"
hkdf = "=0.12.4"
# TOTP 使用标准 HMAC-SHA1，不把 SHA1 用于密码存储或完整性签名。
hmac = "=0.12.1"
sha1 = "=0.10.6"
# hkdf 0.12 使用 digest 0.10；复用已锁定版本，不替换其余模块的 sha2 0.11。
sha2-legacy = { package = "sha2", version = "=0.10.9" }

# M1 ripgrep 搜索核心：只搜索 Broker 提供的内存快照，不启动外部进程。
grep-regex = "=0.1.14"
grep-searcher = "=0.1.17"
grep-matcher = "=0.1.9"

# 路径安全：目录句柄级操作（PRD 12.7、ADR-001）
cap-std = "4.0.3"
cap-tempfile = "4.0.3"
rustix = { version = "1.1.4", features = ["fs"] }
# 运行平面：SQLite WAL，捆绑 SQLite 以固定版本（PRD 0.4、技术栈表）
rusqlite = { version = "0.40.2", features = ["bundled"] }
# 序列化与标识
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# T-043 仅解析 Cargo 清单并保留 span，不启用写出或无界解析特性。
toml_edit = { version = "=0.25.12", default-features = false, features = ["parse"] }
ulid = { version = "3.0.0", features = ["serde"] }
uuid = { version = "1.26.0", features = ["v4", "serde"] }
sha2 = "0.11.0"
thiserror = "2.0.20"
# 时间戳：PRD 6.5 与 9.5 要求 RFC 3339；jiff 处理 Zoned/Timestamp 且 serde 直出
jiff = { version = "0.2.35", features = ["serde"] }
# YAML 读侧（frontmatter 解析与校验）：serde-saphyr（saphyr-parser 之上，活跃维护、panic-free）；yaml-rust2 已进入仅基本维护
serde-saphyr = "1.2.0"
# Stub 私有临时目录及测试夹具
tempfile = "3.27.0"
# M3 供给面与 MCP 主外壳（T-033）：官方 MCP Rust SDK，只启用服务端 Streamable HTTP；o200k 计量冷启动路牌预算
rmcp = { version = "=3.2.0", default-features = false, features = ["server", "macros", "transport-streamable-http-server"] }
tiktoken-rs = "=0.12.0"
http = "=1.5.0"
futures-core = "=0.3.34"
# 路径 Unicode 归一（T-032）：VaultPath 只接受 NFC，碰撞键对磁盘条目名先 NFC 再折叠；unicode-rs 官方维护
unicode-normalization = "0.1.25"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
