[package]
name = "studiolo-auth"
description = "经过验证的 Access 身份与独立持久应用会话"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[features]
default = []
# 仅给跨 crate HTTP 契约提供固定虚构验证器，生产构建禁止启用。
test-support = []
# 发布命令必须显式启用；与测试身份互斥，由编译器拒绝混用。
production = []

[dependencies]
studiolo-audit-ledger.workspace = true
jsonwebtoken.workspace = true
reqwest.workspace = true
tokio = { workspace = true, features = ["time"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
rusqlite.workspace = true
sha2.workspace = true
getrandom.workspace = true
subtle.workspace = true
zeroize.workspace = true
hkdf.workspace = true
sha2-legacy.workspace = true
hmac.workspace = true
sha1.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["time", "test-util"] }
