[package]
name = "studiolo-agent-server"
description = "studiolo-agent：面向 AI 接入方的 MCP 主外壳（Streamable HTTP，仅 loopback）与可信本地管理子命令（M3）。"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[lib]
name = "studiolo_agent_server"
path = "src/lib.rs"

[[bin]]
name = "studiolo-agent"
path = "src/main.rs"

[dependencies]
studiolo-supply.workspace = true
studiolo-policy.workspace = true
# 秘密驻留面加固：与另外三个持明文秘密的程序共用同一份实现。该 crate 的依赖只有
# rustix，不会把认证栈拉进供给面，因此不触碰「agent-server 不得依赖 auth」这条边界。
studiolo-process-safety.workspace = true
studiolo-audit-ledger.workspace = true
studiolo-core.workspace = true
axum.workspace = true
http.workspace = true
futures-core.workspace = true
rmcp.workspace = true
tokio = { workspace = true, features = ["time", "signal", "rt-multi-thread", "macros"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
jiff.workspace = true
ulid.workspace = true
sha2.workspace = true
# 仅供 admin::terminal 核验并写入固定的 /dev/tty：类型 token 只在真实前台控制终端
# 显示一次。架构守卫另限具体调用点，不得借此获得任意文件或子进程能力。
rustix = { workspace = true, features = ["process", "termios"] }

[dev-dependencies]
tempfile.workspace = true
reqwest.workspace = true
