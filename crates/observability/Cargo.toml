[package]
name = "studiolo-observability"
description = "健康聚合、磁盘与同步配额、带外告警、死人开关与出站事件门铃；不新增无鉴权对外入口"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
studiolo-core.workspace = true
studiolo-audit-ledger.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
rustix = { workspace = true, features = ["fs", "process"] }
thiserror.workspace = true
reqwest = { workspace = true, features = ["blocking", "json"] }
# 出站门铃的 Standard Webhooks 签名：HMAC-SHA256（hmac 0.12 配 digest 0.10 的 sha2）与 base64。
hmac.workspace = true
sha2-legacy.workspace = true
base64.workspace = true
zeroize.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio.workspace = true
