[package]
name = "studiolo-host-config"
description = "可信主人配置与服务根的封闭安全装配"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
studiolo-core.workspace = true
studiolo-auth.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
# 只需只读配置文件与本进程读数；秘密驻留面加固（含需要 mm 的 mlockall）住在
# studiolo-process-safety，本 crate 不再持有那份实现，也不再需要 mm 特性。
rustix = { workspace = true, features = ["fs", "process"] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
