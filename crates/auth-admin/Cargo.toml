[package]
name = "studiolo-auth-admin"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = []
production = ["studiolo-auth/production"]

[dependencies]
studiolo-auth.workspace = true
studiolo-host-config.workspace = true
studiolo-audit-ledger.workspace = true
zeroize.workspace = true
thiserror.workspace = true
# 只需控制终端与本进程读数；秘密驻留面加固（含需要 mm 的 mlockall）已统一到
# studiolo-host-config 的 process_safety，本 crate 不再自持那份能力。
rustix = { workspace = true, features = ["termios", "process"] }
signal-hook.workspace = true

[dev-dependencies]
serde_json.workspace = true
tempfile.workspace = true
hmac.workspace = true
sha1.workspace = true

[lints]
workspace = true
