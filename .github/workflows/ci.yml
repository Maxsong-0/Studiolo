# ADR-008：CI 在 Linux x86_64 上跑 fmt / clippy / test；路径安全负向测试只在 Linux 有真实语义。
# PRD 12.8：第三方 action 一律按 commit SHA 钉死，注释里写对应 tag；升级时同时改 SHA 与注释。
# toolchain 版本与 rust-toolchain.toml 保持一致（两处同改）。
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  rust:
    name: fmt / clippy / test (Linux x86_64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 安装固定 toolchain（与 rust-toolchain.toml 同版本）
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy
          rustup default 1.97.1
          rustc --version
          cargo --version

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: 格式检查
        run: cargo --locked fmt --all -- --check

      - name: 部署脚本回归
        run: |
          for script in scripts/package-agent.sh scripts/run-agent-tests.sh scripts/sync-agent-vault.sh scripts/package-preview.sh scripts/run-preview-tests.sh deploy/agent/install-t036-system.sh; do
            bash -n "$script"
          done
          python3 scripts/test-check-agent.py
          python3 scripts/test-check-agent-replica.py
          python3 scripts/test-sync-agent-vault.py
          python3 scripts/test-prepare-agent-sync.py
          python3 scripts/test-replica-receiver.py
          python3 scripts/test-replica-boundaries.py
          python3 scripts/test-check-preview.py
          python3 scripts/test-client-projection-schema.py
          python3 scripts/test-client-projection-fetch.py
          python3 scripts/test-client-projection-store.py

      - name: Clippy（警告即失败）
        run: cargo --locked clippy --workspace --all-targets -- -D warnings

      - name: Workspace 测试
        run: |
          python3 --version
          cargo --locked test --workspace

      - name: Python 副本发布与真实 MCP 管线
        run: |
          cargo --locked build -p studiolo-agent-server
          python3 scripts/check-replica-pipeline.py target/debug/studiolo-agent
          python3 scripts/check-client-projection-pipeline.py target/debug/studiolo-agent

      - name: Linux 路径安全负向测试（显式验收）
        run: cargo --locked test -p studiolo-vault-broker --test linux_path_security

      - name: 生产身份特征构建（禁止混入虚构测试验证器）
        run: cargo --locked build -p studiolo-local-server --features studiolo-auth/production

      - name: 本地登记工具生产特征构建
        run: |
          cargo --locked build -p studiolo-auth-admin --features production
          python3 crates/auth-admin/tests/support/cli_process.py target/debug/studiolo-auth-admin

  frontend:
    name: 前端类型 / 构建 / 测试 / 规范
    runs-on: ubuntu-24.04
    container: node:22.17.0-bookworm-slim
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 安装固定依赖（不运行安装脚本）
        run: npm ci --ignore-scripts
      - name: 生产构建与类型检查
        run: npm run build
      - name: 前端契约测试
        run: npm test
      - name: 代码规范
        run: npm run lint
      - name: 格式检查
        run: npm run format
