# ADR-008：CI 在 Linux x86_64 上跑 fmt / clippy / test；路径安全负向测试只在 Linux 有真实语义。
# PRD 12.8：第三方 action 一律按 commit SHA 钉死，注释里写对应 tag；升级时同时改 SHA 与注释。
# toolchain 版本与 rust-toolchain.toml 保持一致（两处同改）。
name: CI

# T-080：push 只对 main 触发。原先 `branches: ["**"]` 加 `pull_request` 会让每次向 PR 分支推送把整套检查跑两遍，
# 私有仓库的免费分钟数两天就烧光了。PR 走 pull_request，合并后的 main 走 push，各一遍。
on:
  push:
    branches: [main]
  pull_request:

# 同一个 PR 上被新推送顶替的旧运行自动取消；main 上每个合并点都要有结论，不取消。
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  PYTHONDONTWRITEBYTECODE: "1"
  # 仓库已有 145+ 个测试目标，每个都静态链接整棵依赖树。带完整 DWARF 时 target/ 超过
  # 7 GiB，会把 ubuntu-24.04 runner 的磁盘写满，链接器随即以 SIGBUS 失败
  # （collect2: ld terminated with signal 7 [Bus error]）。line-tables-only 保留 panic
  # 回溯的文件与行号，只丢弃完整调试信息，不改变任何测试结果。
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  # CI 每次都是全新构建，增量产物只占磁盘不省时间。
  CARGO_INCREMENTAL: "0"

jobs:
  rust:
    name: fmt / clippy / test (Linux x86_64)
    # T-080：仓库变量 CI_RUNNER_LABELS（JSON 数组，如 ["self-hosted","linux","x64","studiolo"]）存在就走自托管 runner，
    # 删掉变量即回退 GitHub 托管。自托管机器的搭建见 deploy/ci-runner/README.md。
    runs-on: ${{ vars.CI_RUNNER_LABELS && fromJSON(vars.CI_RUNNER_LABELS) || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 腾出 runner 磁盘（预装 SDK 与本仓库无关）
        # 只对 GitHub 托管机器有意义；自托管 runner 无 sudo，磁盘由机器上的清理定时器管。
        if: runner.environment == 'github-hosted'
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /

      # 打包契约测试（test-agent-package.py／test-preview-package.py）要调 node 解析 cargo 的 JSON 输出：
      # GitHub 托管镜像预装了它，自建机器没有。版本与前端作业的容器一致。
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.17.0

      - name: 自托管 runner：rustup 的 bin 目录进 PATH
        # GitHub 托管镜像预装 rustup 且已在 PATH；自托管机器上它装在 runner 用户的 ~/.cargo/bin。
        # 用 GITHUB_PATH 而不是依赖机器上的 .path／.env：头三轮自托管 CI 都死在 `rustup: command not found`。
        if: runner.environment == 'self-hosted'
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: 安装固定 toolchain（与 rust-toolchain.toml 同版本）
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy
          rustup default 1.97.1
          rustc --version
          cargo --version

      # 自托管 runner 的 CARGO_TARGET_DIR 常驻在机器上（runner 的 .env 里设），不需要把几个 GB 的缓存经家用上行传到 GitHub 再取回。
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: runner.environment == 'github-hosted'

      - name: 格式检查
        run: cargo --locked fmt --all -- --check

      - name: 部署脚本回归
        run: |
          for script in scripts/package-agent.sh scripts/run-agent-tests.sh scripts/sync-agent-vault.sh scripts/package-preview.sh scripts/run-preview-tests.sh deploy/agent/install-t036-system.sh deploy/agent/upgrade-read-supply.sh.in deploy/agent/enable-m4-policy.sh.in; do
            bash -n "$script"
          done
          python3 scripts/test-agent-package.py
          python3 scripts/test-render-agent-upgrade.py
          python3 scripts/test-prepare-m4-policy.py
          python3 scripts/test-m4-recovery.py
          python3 -I -B scripts/test-human-offline.py
          python3 scripts/test-check-agent-policy.py
          python3 scripts/test-check-policy-revocation.py
          python3 scripts/test-preview-package.py
          python3 scripts/test-check-agent-http.py
          python3 scripts/test-check-agent.py
          python3 scripts/test-check-agent-replica.py
          python3 scripts/test-sync-agent-vault.py
          python3 scripts/test-prepare-agent-sync.py
          python3 scripts/test-replica-receiver.py
          python3 scripts/test-replica-boundaries.py
          python3 scripts/test-check-preview.py
          python3 scripts/test-check-preview-exercise.py
          python3 scripts/test-package-inputs.py
          python3 scripts/test-client-projection-schema.py
          python3 scripts/test-client-projection-fetch.py
          python3 scripts/test-client-projection-store.py
          python3 scripts/test-local-client-core.py
          python3 scripts/test-local-client-native.py
          python3 scripts/test-local-client-server.py
          python3 scripts/test-local-client-contract.py
          python3 deploy/blackboard/test_assembly.py
          python3 deploy/blackboard/test_freeze.py
          python3 deploy/blackboard/test_activation.py
          python3 deploy/blackboard/test_sync_tools.py
          python3 deploy/blackboard/test_sync_release.py
          python3 -I -B deploy/sync-bridge/recovery/test_canonical_snapshot.py
          python3 -I -B deploy/sync-bridge/recovery/test_credentials.py
          python3 -I -B deploy/sync-bridge/test_pair_production.py
          python3 scripts/tests/test_runner_launch.py
          # 这三份的夹具曾依赖环境 umask：Ubuntu 普通用户默认 002，服务器原生自检因此红过（T-079）。
          # 在敌对 umask 下再跑一遍，测试必须自己钉住前提。
          ( umask 002; python3 scripts/test-sync-agent-vault.py; python3 scripts/test-replica-receiver.py; python3 scripts/test-replica-boundaries.py )

      - name: Clippy（警告即失败）
        run: cargo --locked clippy --workspace --all-targets -- -D warnings

      - name: Workspace 测试
        # T-050/T-059 的秘密驻留面加固在 Linux 上用 mlockall 把持有明文秘密的页锁住。
        # RLIMIT_MEMLOCK 不足时加固失败关闭并终止进程（正确行为，不得改成尽力而为），
        # 约 40 个 composition 用例会集体红。必须在**同一个 shell** 里先抬高硬上限再跑 cargo：
        # GitHub Actions 每个 run 步骤是独立 shell，上一步抬高不会传到下一步。
        run: |
          python3 --version
          [ "$(ulimit -l)" = unlimited ] || sudo prlimit --pid $$ --memlock=unlimited:unlimited
          ulimit -l
          cargo --locked test --workspace
          cargo --locked test -p studiolo-vault-broker --example t132-restore-probe

      - name: Python 副本发布与真实 MCP 管线
        # 这两条管线各起一个真实 studiolo-agent serve；T-065 起该程序同样跑秘密驻留面
        # 加固（mlockall），RLIMIT_MEMLOCK 不足时它会失败关闭并终止（正确行为，不得改成
        # 尽力而为），管线会连一个请求都发不出去。每个 run 步骤是独立 shell，上一步抬高
        # 的上限不会传到这里，必须在本步骤内再抬一次。
        run: |
          cargo --locked build -p studiolo-agent-server
          [ "$(ulimit -l)" = unlimited ] || sudo prlimit --pid $$ --memlock=unlimited:unlimited
          ulimit -l
          python3 scripts/check-replica-pipeline.py "${CARGO_TARGET_DIR:-target}/debug/studiolo-agent"
          python3 scripts/check-client-projection-pipeline.py "${CARGO_TARGET_DIR:-target}/debug/studiolo-agent"
          ( umask 002; python3 scripts/check-replica-pipeline.py "${CARGO_TARGET_DIR:-target}/debug/studiolo-agent"; python3 scripts/check-client-projection-pipeline.py "${CARGO_TARGET_DIR:-target}/debug/studiolo-agent" )

      - name: Linux 路径安全负向测试（显式验收）
        run: cargo --locked test -p studiolo-vault-broker --test linux_path_security

      - name: 生产身份特征构建（禁止混入虚构测试验证器）
        run: cargo --locked build -p studiolo-local-server --features studiolo-auth/production

      - name: 本地登记工具生产特征构建
        # 该 CLI 启动时会跑秘密驻留面加固（mlockall），同样需要在本 shell 内抬高 RLIMIT_MEMLOCK。
        run: |
          cargo --locked build -p studiolo-auth-admin --features production
          cargo --locked build -p studiolo-vault-admin
          [ "$(ulimit -l)" = unlimited ] || sudo prlimit --pid $$ --memlock=unlimited:unlimited
          python3 crates/auth-admin/tests/support/cli_process.py "${CARGO_TARGET_DIR:-target}/debug/studiolo-auth-admin"

  frontend:
    name: 前端类型 / 构建 / 测试 / 规范
    runs-on: ${{ vars.CI_RUNNER_LABELS && fromJSON(vars.CI_RUNNER_LABELS) || 'ubuntu-24.04' }}
    # T-081：原先是 `container: node:22.17.0-bookworm-slim` 的容器作业。改为原生 ＋ setup-node
    # 固定同一版本：自托管机器因此不需要 Docker，runner 用户也不必留在 docker 组（docker 组在本机等同 root）。
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.17.0
      - name: 安装固定依赖（不运行安装脚本）
        run: npm ci --ignore-scripts
      - name: 生产构建与类型检查
        run: npm run build
      - name: 前端契约测试
        run: npm test
      - name: 代码规范
        run: npm run lint
      - name: 格式检查
        run: npm run format
